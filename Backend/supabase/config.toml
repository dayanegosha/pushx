project_id = "forma"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[functions.delete-account]
# The handler always calls Auth /user to validate the session and load current
# identities. This supports new asymmetric signing keys as well as legacy JWTs.
verify_jwt = false
