name: Forma
options:
  bundleIdPrefix: app.forma
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  knownRegions: [en, ru, zh-Hans, Base]
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  Forma:
    type: application
    platform: iOS
    sources:
      - path: Forma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.forma.pushups
        INFOPLIST_FILE: Forma/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Forma/Resources/Forma.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [FormaTests, FormaUITests]
      storeKitConfiguration: Forma/Resources/Forma.storekit
  FormaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FormaTests]
    dependencies:
      - target: Forma
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FormaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FormaUITests]
    dependencies:
      - target: Forma
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
