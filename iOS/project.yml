name: pushx
options:
  bundleIdPrefix: app.pushx
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  knownRegions: [en, ru, zh-Hans, Base]
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  pushx:
    type: application
    platform: iOS
    sources:
      - path: pushx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.forma.pushups
        INFOPLIST_FILE: pushx/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: pushx/Resources/pushx.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [pushxTests, pushxUITests]
      storeKitConfiguration: pushx/Resources/pushx.storekit
  pushxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [pushxTests]
    dependencies:
      - target: pushx
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  pushxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [pushxUITests]
    dependencies:
      - target: pushx
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
